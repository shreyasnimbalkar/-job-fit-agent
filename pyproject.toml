[project]
name = "jobfit"
version = "0.1.0"
description = "Multi-agent CLI that scores job fit and tailors a resume using Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobfit = "jobfit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobfit", "jobfit.agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
